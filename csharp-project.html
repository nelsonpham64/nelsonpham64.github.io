<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>C# Bakery Vending Machine - Nelson Pham</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --color-bg: #1a1a1a;
      --color-surface: #242424;
      --color-card: #2d2d2d;
      --color-warm-gold: #d4a574;
      --color-gold-light: #e8c4a0;
      --color-text: #e8e8e8;
      --color-text-dim: #b0b0b0;
      --color-border: #3a3a3a;

      --font-serif: "Playfair Display", serif;
      --font-sans: "Lato", sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--color-bg);
      color: var(--color-text);
      line-height: 1.7;
    }

    nav {
      padding: 2rem 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(26, 26, 26, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--color-border);
    }

    .logo {
      font-family: var(--font-serif);
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--color-warm-gold);
      text-decoration: none;
    }

    .back-link {
      color: var(--color-text-dim);
      text-decoration: none;
      font-size: 1rem;
      transition: color 0.3s ease;
    }

    .back-link:hover {
      color: var(--color-warm-gold);
    }

    .project-hero {
      padding: 6rem 5% 4rem;
      text-align: center;
      background: linear-gradient(135deg, #1a1a1a 0%, #242424 100%);
    }

    .project-content {
      max-width: 1000px;
      margin: 0 auto;
      padding: 4rem 5%;
    }

    .section {
      margin-bottom: 4rem;
    }

    .btn-group {
      display: flex;
      gap: 1rem;
      margin-top: 3rem;
      flex-wrap: wrap;
    }

    .btn {
      padding: 1rem 2rem;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 500;
      transition: all 0.3s ease;
      display: inline-block;
    }

    .btn-primary {
      background: var(--color-warm-gold);
      color: #1a1a1a;
    }

    .btn-primary:hover {
      background: var(--color-gold-light);
      transform: translateY(-2px);
    }

    .btn-secondary {
      background: transparent;
      color: var(--color-warm-gold);
      border: 2px solid var(--color-warm-gold);
    }

    .btn-secondary:hover {
      background: var(--color-warm-gold);
      color: #1a1a1a;
    }

  </style>
</head>

<body>

  <!-- rest of your content unchanged -->

  <div class="btn-group">

    <!-- ✅ FIXED BUTTON -->
    <a href="https://github.com/nelsonpham64/c-project" class="btn btn-primary" target="_blank">
      View Code on GitHub
    </a>

    <a href="index.html#projects" class="btn btn-secondary">
      ← Back to Projects
    </a>

  </div>

</body>
</html>
